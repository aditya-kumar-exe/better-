version: 2.1

jobs:
  build_tests:
    docker:
      - image: circleci/node:12
    steps:
      - checkout
      - run:
          name: Install npm dependencies
          command: npm install --save

  build_docker_image:
    docker:
      - image: circleci/node:12
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Build and Push Docker image
          command: |
            docker build -t adityakumar00/better:latest .
            echo $DOCKER_PASSWORD | docker login -u adityakumar00 --password-stdin
            docker push adityakumar00/better:latest

workflows:
  build_and_deploy:
    jobs:
      - build_tests
      - build_docker_image:
          requires:
            - build_tests
